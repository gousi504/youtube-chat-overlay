<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Chat Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;800&family=Kosugi+Maru&family=DotGothic16&family=Shippori+Mincho:wght@500;700&family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Kaisei+Decol:wght@500;700&family=Yusei+Magic&family=Dela+Gothic+One&family=RocknRoll+One&family=Yuji+Syuku&family=Yuji+Boku&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
</head>
<body class="theme-simple anim-slide outline dir-bottom align-left">
<div id="list"></div>
<script src="themes.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const isPreview = params.get("preview") === "1";
  if (isPreview) document.body.classList.add("preview");

  const list = document.getElementById("list");
  let cfg = buildConfig({});
  const timers = new Map();

  // ---------- helpers ----------
  const { isColor, hexToRgba } = OverlayCommon;
  // ---- superchat color tone ----
  // YouTube's superchat colors are very bright (cyan, lime, yellow), so white text is hard to read on them.
  // Keep the hue (so the price tier is still recognizable) but lower saturation and darken
  // until white text reaches a readable contrast ratio.
  function hexToHsl(hex) {
    const h6 = hex.replace("#", ""); const n = parseInt(h6.length === 3 ? h6.split("").map(c => c + c).join("") : h6, 16);
    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    let h = 0, s = 0;
    if (d) {
      s = d / (1 - Math.abs(2 * l - 1));
      h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h = (h * 60 + 360) % 360;
    }
    return [h, s, l];
  }
  function hslToRgb(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r + m, g + m, b + m];
  }
  function contrastWithWhite(rgb) {
    const lin = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    const L = 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
    return 1.05 / (L + 0.05);
  }
  function toneColor(hex, tone) {
    if (tone !== "calm" && tone !== "deep") return hex; // vivid: as is
    const maxSat = tone === "deep" ? 0.55 : 0.68, target = tone === "deep" ? 7 : 4.5;
    let [h, s, l] = hexToHsl(hex);
    s = Math.min(s, maxSat);
    let rgb = hslToRgb(h, s, l);
    while (contrastWithWhite(rgb) < target && l > 0.12) { l -= 0.01; rgb = hslToRgb(h, s, l); }
    return "#" + rgb.map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
  }
  function paintSuperchat(el) {
    const c = toneColor(el.dataset.sc, cfg.scTone);
    el.style.setProperty("--sc", hexToRgba(c, "var(--sc-a,1)"));
    el.style.setProperty("--sc-solid", c);
  }
  function lighten(hex, amt) {
    const h = (hex || "#000").replace("#", "");
    const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
    const r = Math.min(255, ((n >> 16) & 255) + amt), g = Math.min(255, ((n >> 8) & 255) + amt), b = Math.min(255, (n & 255) + amt);
    return `rgb(${r},${g},${b})`;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtTime(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function splitList(s) {
    return String(s || "").split(/[\n,、，]/).map(x => x.trim()).filter(Boolean);
  }

  // ---------- apply config ----------
  function applyConfig(c) {
    cfg = OverlayCommon.apply(c, [isPreview ? "preview" : ""]);
    list.querySelectorAll(".msg.superchat").forEach(paintSuperchat); // re-tone comments already on screen
    trim();
  }

  // ---------- render ----------
  function isBlocked(m) {
    const words = splitList(cfg.ngWords);
    const users = splitList(cfg.ngUsers);
    if (cfg.hideOwner && m.isOwner) return true;
    if (users.some(u => m.author.name === u || m.author.channelId === u)) return true;
    const text = m.message.map(p => p.text || p.alt || "").join("");
    if (words.some(w => text.includes(w))) return true;
    return false;
  }

  function render(m) {
    if (isBlocked(m)) return;
    const el = document.createElement("div");
    el.className = "msg new";
    if (m.isMembership) el.classList.add("member");
    if (m.isModerator) el.classList.add("moderator");
    if (m.isOwner) el.classList.add("owner");
    if (m.superchat && cfg.superchatHighlight) {
      el.classList.add("superchat");
      el.dataset.sc = isColor(m.superchat.color) ? m.superchat.color : "#1e88e5";
      paintSuperchat(el);
    }

    let html = "";
    if (cfg.showIcon && m.author.icon) {
      html += `<img class="icon" src="${esc(m.author.icon)}" alt="" onerror="this.style.visibility='hidden'">`;
    }
    html += `<div class="body">`;
    const head = [];
    if (cfg.showName) head.push(`<span class="name">${esc(m.author.name)}</span>`);
    if (cfg.showBadge && m.author.badge) head.push(`<img class="badge" src="${esc(m.author.badge)}" alt="">`);
    if (m.superchat) head.push(`<span class="amount">${esc(m.superchat.amount)}</span>`);
    if (cfg.showTime) head.push(`<span class="time">${fmtTime(m.timestamp)}</span>`);
    if (head.length) html += `<div class="head">${head.join("")}</div>`;
    const text = m.message.map(p =>
      p.emoji ? `<img class="emoji" src="${esc(p.emoji)}" alt="${esc(p.alt)}">` : esc(p.text)
    ).join("");
    if (text) html += `<span class="text">${text}</span>`;
    if (m.superchat && m.superchat.sticker) html += `<img class="sticker" src="${esc(m.superchat.sticker)}" alt="">`;
    html += `</div>`;
    // second copy of the amount, shown only when position = right edge
    if (m.superchat) html += `<span class="amount side">${esc(m.superchat.amount)}</span>`;
    el.innerHTML = html;

    list.appendChild(el);
    setTimeout(() => el.classList.remove("new"), 1000); // longest entry animation is 0.9s

    if (cfg.fadeOutSec > 0) {
      const t = setTimeout(() => remove(el), cfg.fadeOutSec * 1000);
      timers.set(el, t);
    }
    trim();
  }

  function remove(el) {
    if (!el.isConnected) return;
    el.classList.add("out");
    setTimeout(() => el.remove(), 600);
    const t = timers.get(el);
    if (t) { clearTimeout(t); timers.delete(el); }
  }

  function trim() {
    const items = Array.from(list.children).filter(e => !e.classList.contains("out"));
    const over = items.length - cfg.maxMessages;
    for (let i = 0; i < over; i++) {
      const el = items[i];
      el.remove(); // oldest disappear instantly to keep layout tidy
      const t = timers.get(el);
      if (t) { clearTimeout(t); timers.delete(el); }
    }
    // Drop only what is completely outside. A comment that is partly outside stays and is
    // clipped by the page edge (soft-faded by CSS), so no empty hole appears where it was.
    requestAnimationFrame(() => {
      const box = list.getBoundingClientRect();
      for (const el of Array.from(list.children)) {
        const r = el.getBoundingClientRect();
        const outside = cfg.direction === "top" ? r.top >= box.bottom : r.bottom <= box.top;
        if (outside) el.remove();
      }
    });
  }

  function clearAll() {
    list.innerHTML = "";
    timers.forEach(t => clearTimeout(t));
    timers.clear();
  }

  // ---------- websocket ----------
  applyConfig({});
  OverlayCommon.connect((d) => {
    if (d.type === "config") applyConfig(d.config);
    else if (d.type === "chat") render(d);
    else if (d.type === "clear") clearAll();
  });
})();
</script>
</body>
</html>
