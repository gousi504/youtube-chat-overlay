<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Topic Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;800&family=Kosugi+Maru&family=DotGothic16&family=Shippori+Mincho:wght@500;700&family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Kaisei+Decol:wght@500;700&family=Yusei+Magic&family=Dela+Gothic+One&family=RocknRoll+One&family=Yuji+Syuku&family=Yuji+Boku&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
</head>
<body class="topic-page theme-simple">
<div id="list"></div>
<script src="themes.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const isPreview = params.get("preview") === "1";
  // which frame this page shows: topic.html?id=1 .. 3
  const idx = Math.min(TOPIC_COUNT, Math.max(1, parseInt(params.get("id"), 10) || 1)) - 1;

  const list = document.getElementById("list");
  let lastKey = null;
  let current = null;

  function applyConfig(c) {
    const t = buildConfig(c).topics[idx];
    OverlayCommon.apply(c, ["topic-page", "ta-" + t.align, isPreview ? "preview" : ""]);
    document.documentElement.style.setProperty("--topic-size", t.size + "px");

    const visible = t.show && !!(t.label || t.text);
    const key = visible ? t.label + "\u0000" + t.text : "";
    if (key === lastKey) return; // only the look changed: keep the frame as is
    lastKey = key;

    if (!visible) {
      if (current) { const old = current; current = null; old.classList.add("out"); setTimeout(() => old.remove(), 600); }
      if (isPreview) showHint(t.show ? "内容が空です" : "この枠は非表示です");
      return;
    }

    list.innerHTML = "";
    const el = document.createElement("div");
    el.className = "msg topic new";
    const body = document.createElement("div");
    body.className = "body";
    if (t.label) {
      const head = document.createElement("div");
      head.className = "head";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = t.label;
      head.appendChild(name);
      body.appendChild(head);
    }
    if (t.text) {
      const text = document.createElement("span");
      text.className = "text";
      text.textContent = t.text;
      body.appendChild(text);
    }
    el.appendChild(body);
    list.appendChild(el);
    current = el;
    setTimeout(() => el.classList.remove("new"), 1000);
  }

  function showHint(msg) {
    setTimeout(() => {
      if (current) return;
      list.innerHTML = "";
      const p = document.createElement("div");
      p.className = "topic-hint";
      p.textContent = "（" + msg + "）";
      list.appendChild(p);
    }, 620);
  }

  OverlayCommon.connect((d) => { if (d.type === "config") applyConfig(d.config); });
})();
</script>
</body>
</html>
